<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#078CF0">
<meta name="application-name" content="MEasyMate Factory Daily">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MEasyMate Factory Daily - Single File 1.3</title>
<style>
:root{
  --blue:#078CF0;--cyan:#10BFEF;--teal:#11C6A5;--navy:#063C78;
  --ink:#123B61;--muted:#6C879B;--line:#D2EBF5;--bg:#F1FAFF;--card:#fff
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
  background:var(--bg);color:var(--ink)
}
#app{height:100dvh;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.top{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;padding-top:max(7px,env(safe-area-inset-top));
  background:linear-gradient(100deg,#F7FDFF 0,#EEFAFF 48%,#EEFCF8 100%);
  border-bottom:1px solid #CDEAF4;
  box-shadow:0 8px 26px -21px rgba(6,60,120,.72);
  z-index:30
}
.brandLogo{
  width:43px;height:43px;flex:0 0 43px;border-radius:50%;object-fit:cover;
  border:2px solid #CDEFF5;background:white;
  box-shadow:0 4px 13px rgba(7,140,240,.18)
}
.backBtn{
  display:none;border:1px solid #BFE5F2;
  background:linear-gradient(135deg,#E8F7FF,#E8FBF6);
  color:#075F9F;border-radius:11px;padding:8px 9px;
  font-weight:900;font-size:11px;cursor:pointer
}
.backBtn.show{display:block}
.brand{min-width:0;flex:1}
.brand .created{display:block;font-size:8px;color:#638297;font-weight:700}
.brand b{display:block;font-size:13px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tagline{display:block;font-size:8px;color:#0B9584;font-weight:850;margin-top:1px}
.headerActions{display:flex;align-items:center;gap:5px}
.newsBtn{
  position:relative;border:1px solid #C7EAF2;
  background:linear-gradient(135deg,#E7F7FF,#E8FBF6);
  color:#06769E;border-radius:11px;width:36px;height:36px;font-size:16px;cursor:pointer
}
.newsDot{
  display:none;position:absolute;width:8px;height:8px;border-radius:50%;
  background:#FF5A68;right:5px;top:5px;border:1.5px solid white
}
.newsDot.on{display:block}
.badge{
  font-size:7px;font-weight:950;color:#078575;
  background:#E8FBF6;border:1px solid #CFEDE5;
  border-radius:999px;padding:5px 6px;white-space:nowrap
}
.stage{position:relative;min-height:0;overflow:hidden}
#hub{
  height:100%;overflow:auto;padding:14px 14px 90px;
  background:
    radial-gradient(circle at 92% 0%,rgba(17,198,165,.19),transparent 31%),
    radial-gradient(circle at 5% 1%,rgba(7,140,240,.18),transparent 31%),
    linear-gradient(180deg,#EAF8FF 0,#F8FDFF 430px)
}
.hero{max-width:640px;margin:0 auto 13px}
.heroPanel{
  padding:15px 14px;
  background:linear-gradient(135deg,#078CF0 0%,#10BFEF 52%,#11C6A5 100%);
  border-radius:20px;color:#fff;
  box-shadow:0 15px 34px -25px rgba(6,60,120,.72)
}
.heroPanel .eyebrow{font-size:9px;font-weight:900;opacity:.9;letter-spacing:.05em}
.heroPanel h1{font-size:24px;margin:2px 0 2px}
.heroPanel p{font-size:10px;margin:0;opacity:.93}
.grid{max-width:640px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{
  border:1px solid var(--line);background:rgba(255,255,255,.97);
  border-radius:18px;padding:14px;text-align:left;
  box-shadow:0 12px 30px -26px rgba(6,60,120,.72);
  cursor:pointer;color:inherit;transition:.12s
}
.tool:active{transform:scale(.985)}
.ico{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,#DDF4FF,#DFFAF2);
  border:1px solid #D2EDF4
}
.tool b{display:block;margin-top:8px;font-size:15px;color:#075C98}
.tool span{display:block;margin-top:3px;font-size:9px;color:var(--muted);line-height:1.45}
.offline{
  max-width:640px;margin:11px auto 0;
  background:linear-gradient(135deg,#E9F8FF,#EAFBF7);
  border:1px solid #D1EDEB;border-radius:13px;padding:10px;
  font-size:9px;color:#4E756F;line-height:1.5
}
#frameWrap{position:absolute;inset:0;display:none;background:#fff}
#toolFrame{width:100%;height:100%;border:0;display:block;background:#fff}
.nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#fff;
  border-top:1px solid #CFE8F2;
  padding:5px 5px max(5px,env(safe-area-inset-bottom));z-index:30
}
.nav button{
  border:0;background:transparent;color:#648398;border-radius:11px;
  padding:5px 2px;font:760 8px system-ui;min-width:0
}
.nav button i{font-style:normal;display:block;font-size:17px;line-height:1.1;margin-bottom:2px}
.nav button.on{
  background:linear-gradient(135deg,#DFF4FF,#E0FAF3);
  color:#0577A2
}

/* Notice - logo intentionally omitted: main header is the only logo position */
#noticeShade{
  display:none;position:fixed;inset:0;background:rgba(4,30,55,.28);
  z-index:1000;padding:18px;align-items:flex-end;justify-content:center
}
#noticeShade.show{display:flex}
.noticeCard{
  width:min(430px,100%);background:#fff;border:1px solid #D3EAF3;border-radius:20px;
  overflow:hidden;box-shadow:0 24px 65px rgba(5,45,80,.25)
}
.noticeHead{
  display:flex;align-items:center;gap:9px;padding:11px;
  background:linear-gradient(135deg,#E6F7FF,#E7FBF5);
  border-bottom:1px solid #D8ECF3
}
.noticeMark{
  width:31px;height:31px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#078CF0,#11C6A5);
  color:#fff;font-weight:950;font-size:15px
}
.noticeTitle{flex:1;min-width:0}
.noticeTitle b{display:block;font-size:13px;color:var(--navy)}
.noticeTitle span{font-size:8px;color:#64869A}
.noticeType{
  font-size:8px;font-weight:950;color:#078F81;background:#fff;
  border:1px solid #D6EEE8;border-radius:999px;padding:4px 7px
}
.noticeBody{padding:13px;font-size:11px;line-height:1.55}
.noticeBody h3{font-size:15px;color:#075A96;margin:0 0 5px}
.noticeActions{display:flex;gap:8px;margin-top:12px}
.noticeActions button,.noticeActions a{
  flex:1;border:0;border-radius:11px;padding:10px;
  text-align:center;text-decoration:none;font:850 10px system-ui;cursor:pointer
}
.noticePrimary{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff}
.noticeSecondary{background:#EEF4F7;color:#577184}
.toast{
  display:none;position:fixed;left:50%;bottom:72px;transform:translateX(-50%);
  z-index:1200;background:#086A8D;color:white;padding:8px 12px;border-radius:999px;
  font-size:10px;box-shadow:0 8px 25px rgba(0,0,0,.18);white-space:nowrap
}
.toast.show{display:block}
@media(max-width:430px){
  .badge{display:none}
  .brandLogo{width:39px;height:39px;flex-basis:39px}
}
@media(max-width:380px){
  .grid{grid-template-columns:1fr}
  .heroPanel h1{font-size:21px}
  .nav button{font-size:7px}
}

/* ===== V1.3 Home / Index ROSE branding ===== */
.heroPanel{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.heroCopy{min-width:0;flex:1}
.roseHome{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.72);
  border-radius:50%;
  box-shadow:0 9px 24px -15px rgba(2,46,92,.65);
}
.roseHome img{
  display:block;
  width:72px;
  height:72px;
  object-fit:cover;
  border-radius:50%;
}
@media(max-width:430px){
  .heroPanel{gap:10px;padding:13px 12px}
  .roseHome img{width:60px;height:60px}
}
@media(max-width:350px){
  .roseHome img{width:52px;height:52px}
}

</style>
</head>

const $=s=>document.querySelector(s);
const hub=$("#hub"),wrap=$("#frameWrap"),frame=$("#toolFrame"),backBtn=$("#backBtn");

function decode64(s){
  const bin=atob(s),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function navState(route){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.route===route));
}
function openRoute(route,push=true){
  if(!route||route==="hub"||!MODULES[route]){
    frame.srcdoc="";
    wrap.style.display="none";
    hub.style.display="block";
    backBtn.classList.remove("show");
    navState("hub");
    if(push)history.replaceState(null,"","#hub");
    return;
  }
  hub.style.display="none";
  wrap.style.display="block";
  backBtn.classList.add("show");
  navState(route);
  frame.srcdoc=decode64(MODULES[route].html);
  if(push)history.replaceState(null,"","#"+route);
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-open],[data-route]");
  if(!a)return;
  openRoute(a.dataset.open||a.dataset.route);
});
backBtn.onclick=()=>openRoute("hub");
window.addEventListener("message",e=>{
  if(e.data&&e.data.type==="measymate-route")openRoute(e.data.route);
});
window.addEventListener("hashchange",()=>openRoute(location.hash.slice(1),false));

const NOTICE_CFG={
  endpoint:"https://notice.measymate.com/messages.json",
  home:"https://measymate.com",
  products:["factory-daily","daily-absence","daily-absence-dashboard","factory-report-5w2h","factory-daily-help"]
};
const noticeShade=$("#noticeShade"),newsDot=$("#newsDot"),toast=$("#toast");
function toastMsg(msg){
  toast.textContent=msg;toast.classList.add("show");
  clearTimeout(window.__t);window.__t=setTimeout(()=>toast.classList.remove("show"),1800);
}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function dateOK(m){
  const now=new Date();
  if(m.start){const s=new Date(m.start+"T00:00:00");if(!isNaN(s)&&now<s)return false}
  if(m.end){const e=new Date(m.end+"T23:59:59");if(!isNaN(e)&&now>e)return false}
  return true;
}
function productOK(m){
  const ps=Array.isArray(m.products)?m.products:["*"];
  return ps.includes("*")||ps.includes("all")||NOTICE_CFG.products.some(p=>ps.includes(p));
}
function safeLink(raw){
  try{
    const u=new URL(raw||NOTICE_CFG.home),h=u.hostname.toLowerCase();
    if(u.protocol==="https:"&&(h==="measymate.com"||h.endsWith(".measymate.com")))return u.href;
  }catch(e){}
  return NOTICE_CFG.home;
}
function eligible(m,seenOK=false){
  if(!m||!m.id||m.active===false||!dateOK(m)||!productOK(m))return false;
  if(!seenOK&&sget("measymate_notice_v12:"+m.id))return false;
  return true;
}
function showNotice(m,remember=true){
  $("#noticeType").textContent=String(m.type||"notice").toUpperCase();
  $("#noticeTitleText").textContent=String(m.title||"ข่าวสารจาก MEasyMate");
  $("#noticeMessageText").textContent=String(m.message||"");
  const a=$("#noticeLink");a.href=safeLink(m.url);a.textContent=String(m.cta||"ดูรายละเอียด");
  noticeShade.classList.add("show");newsDot.classList.remove("on");
  if(remember)sset("measymate_notice_v12:"+m.id,"seen");
}
$("#noticeClose").onclick=()=>noticeShade.classList.remove("show");
noticeShade.onclick=e=>{if(e.target===noticeShade)noticeShade.classList.remove("show")};

async function fetchNotices(manual=false){
  if(!navigator.onLine){if(manual)toastMsg("Offline · ตรวจข่าวไม่ได้");return}
  const controller=typeof AbortController!=="undefined"?new AbortController():null;
  const timer=controller?setTimeout(()=>controller.abort(),4500):null;
  try{
    const r=await fetch(NOTICE_CFG.endpoint,{
      cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer",
      signal:controller?controller.signal:undefined
    });
    if(!r.ok)throw new Error("unavailable");
    const data=await r.json();
    const list=Array.isArray(data)?data:(Array.isArray(data.messages)?data.messages:[]);
    const unseen=list.find(m=>eligible(m,false));
    const any=list.find(m=>eligible(m,true));
    if(unseen){
      newsDot.classList.add("on");
      if(manual)showNotice(unseen,true);
      else setTimeout(()=>showNotice(unseen,true),500);
    }else if(manual&&any)showNotice(any,false);
    else if(manual)toastMsg("ยังไม่มีข่าวหรือ Update ใหม่");
  }catch(e){
    if(manual)toastMsg("ยังเชื่อมต่อศูนย์ข่าว MEasyMate ไม่ได้");
  }finally{if(timer)clearTimeout(timer)}
}
$("#newsBtn").onclick=()=>fetchNotices(true);

openRoute(location.hash.slice(1)||"hub",false);
setTimeout(()=>fetchNotices(false),700);
</script>
